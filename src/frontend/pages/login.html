<!DOCTYPE html>
<html lang="es">
    <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">

       <title> Inicio sesión | Pediatría</title>
       <link rel="stylesheet" href="../styles/style-login.css">
       <script src="../services/login.js" defer></script>
    </head>
    <body>
        <main class="contenedor-login">
            <section class="tarjeta-login">
                <img class="logo-login" src="../assets/LOGO_UAA.png" alt="Logo de la Universidad Autónoma de Aguascalientes">

                <h1 class="titulo-login">Inciar sesion</h1>

                <p class="subtitulo-login">Accede a tu cuenta para continuar</p>

                <form id="form-login">
                    <label for="correo">Correo electrónico:</label>
                    <br>
                    <input type="email" id="correo" name="correo" autocomplete="username" placeholder="tu.correo@ejemplo.com" required>
                    <br>
                    <label for="password">Contraseña: </label>
                    <br>
                    <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required style="width: 100%; padding-right: 40px;">
                        
                    <button type="button" id="btn-toggle-password" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
                    <svg id="icono-ojo" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    </button>
                    </div>
                    <br>
                    <p id="mensaje-error" role="alert" aria-live="polite"></p>
                    
                    <button type="submit" id="btn-login">Iniciar sesión</button>
                </form>

            </section>
        </main>
    </body>
</html>
